[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexora-lang-hi"
version = "0.1.0"
description = "Hindi (Devanagari) language plugin for Lexora — NFC cleaning rules, ADR-0022/ADR-0023."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12,<4.0"
# The plugin is a thin declaration over the core package: it imports
# lexora.canonicalize and lexora.langapi rather than copying either.
dependencies = ["lexora>=0.1.0a1"]

# ADR-0022: this is the whole registration surface. The core discovers the
# plugin through importlib.metadata and never imports it by name.
[project.entry-points."lexora.languages"]
hi = "lexora_lang_hi:plugin"

[tool.setuptools.packages.find]
where = ["src"]
