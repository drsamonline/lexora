# Real CI workflow — README badge references this file (flagged as historical there).
# PAUSED by owner decision 2026-10-17 (OQ-15): GitHub Actions free-tier minutes are
# exhausted; do not push/PR expecting runs until the whole app is complete or the owner
# re-enables Actions. Until then the verification gate is LOCAL: `pytest -q` + linkcheck
# before every commit. The workflow itself stays unchanged so it resumes working as-is.
name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to the commit each tag resolves to. Bumped from the Node-20 builds:
      # GitHub now forces those onto Node 24 and warns they will break.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: "3.12"

      - name: Install Qt system libraries
        # PySide6 imports fail on a bare runner with "libEGL.so.1: cannot open
        # shared object file". The GUI tests are worth covering in CI, so the
        # libraries go in rather than the extra coming out.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          # `pdf` and `gui` are optional extras, but CI is where they must be
          # covered: a test that only runs on a machine with the extra installed
          # is a test nobody runs (found 2026-11-07 — PR #21 went red because the
          # PDF tests needed pypdf and CI installed only [dev]).
          pip install -e ".[dev,pdf,gui,ocr]"

      - name: Run test suite
        # Skips are allowed (benchmark tests skip without corpus data);
        # failures fail the job. QT_QPA_PLATFORM=offscreen lets the GUI suite run
        # headless instead of aborting on a missing display.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Internal link check
        run: python scripts/linkcheck.py
