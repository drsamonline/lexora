[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexora"
version = "0.0.1.dev1"
description = "LEXORA prototype: canonicalization + Zstd core baseline (Phase 1). No stable API."
readme = "README.md"
# PolyForm Noncommercial 1.0.0 per ADR-0009 (2026-10-29, owner decision),
# superseding ADR-0006's MIT. SPDX short identifier per the SPDX licence list;
# the licence is source-available, NOT OSI-approved open source.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
# Requires-python set to EXACTLY what has been executed in development (ADR-0005).
# Container verified: Python 3.12.10. Do not widen without test evidence.
requires-python = ">=3.12,<4.0"
dependencies = [
    # Pinned to the version actually installed & tested (0.25.0, 2026-10-15)
    "zstandard>=0.23,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Benchmark-only: PPMd as a comparison baseline (docs/ECOSYSTEM_REVIEW_2026-11-08.md).
    # Not a runtime dependency — the harness imports it, the product never does.
    "py7zr>=1.0,<2",
    "pyppmd>=1.1,<2",
]
# ADR-0008 decision 1: GUI is an opt-in extra; core install stays Qt-free.
gui = [
    # <6.12 on purpose: 6.12 aborts with a Bus error *after* the suite passes, at
    # Qt teardown on a headless runner (found in CI 2026-11-07). The tests
    # themselves are green; the process exit code is not. Revisit when a later
    # release fixes it — the pin is a workaround, and is recorded as one.
    "pyside6>=6.6,<6.12",
]
# ADR-0017: PDF text-layer ingestion is an opt-in extra, and the engine is pypdf
# (BSD-3-Clause) rather than PyMuPDF (AGPL-3.0) — a permissive dependency avoids the
# copyleft question ADR-0009 left open entirely. Pinned to the version actually tested.
pdf = [
    "pypdf>=5,<7",
]
# ADR-0019: OCR needs pypdf (to pull the embedded page image) and Pillow (to
# re-encode it for tesseract). Both permissive. The `tesseract` *binary* is a
# system dependency the user installs — it is not vendored, exactly like ziptastic.
ocr = [
    "pypdf>=5,<7",
    "pillow>=10,<14",
]

[project.scripts]
lexora = "lexora.cli:main"
# ADR-0008 decision 2: GUI entry point registered now that the window is
# demonstrably runnable (offscreen show/exec smoke passed, Session 28).
# Requires the [gui] extra; without it `lexora-gui` exits 2 with guidance.
lexora-gui = "lexora.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lexora.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make both the package and the benchmark harness importable however pytest is
# invoked. `pytest -q` does NOT put the working directory on sys.path (only
# `python -m pytest` does), so the harness suites — which do
# `from benchmarks import corpus` — failed collection in CI while passing locally
# under `PYTHONPATH=src python3 -m pytest`. That difference is exactly the kind of
# thing a local gate can hide for months, so it is pinned here instead of relying
# on how the suite happens to be launched.
pythonpath = ["src", "."]
# Container images sometimes ship a broken third-party `libtmux` pytest plugin
# (applies marks to fixtures -> collection crash under pytest>=9). Unregister it
# so the local gate `python3 -m pytest -q` works with no extra flags.
# Recorded in docs/NEXT_SESSION.md / SESSION_LOG (Session 23/24 environment notes).
addopts = "-p no:libtmux"
