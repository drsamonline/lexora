[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexora"
version = "0.0.1.dev1"
description = "LEXORA prototype: canonicalization + Zstd core baseline (Phase 1). No stable API."
readme = "README.md"
# MIT per ADR-0006 (OQ-5 resolved by owner instruction 2026-10-15; revocable)
license = "MIT"
license-files = ["LICENSE"]
# Requires-python set to EXACTLY what has been executed in development (ADR-0005).
# Container verified: Python 3.12.10. Do not widen without test evidence.
requires-python = ">=3.12,<4.0"
dependencies = [
    # Pinned to the version actually installed & tested (0.25.0, 2026-10-15)
    "zstandard>=0.23,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
lexora = "lexora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
